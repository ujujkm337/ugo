apply plugin: 'com.android.application'

android {
    namespace 'io.arena.ugo'
    compileSdk 33

    defaultConfig {
        applicationId 'io.arena.ugo'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
        // в приложении только русский текст
        resConfigs 'ru'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('UGO_KEYSTORE') ?: '/home/user/gost/keystore/ugo.keystore')
            storePassword 'ugo2026'
            keyAlias 'ugo'
            keyPassword 'ugo2026'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.7.0'
}
