name: APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Кеш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}

      - name: Сборка
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Подпись (если есть секреты)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          KEY_PASS:      ${{ secrets.KEY_PASS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/ugo.keystore
          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks /tmp/ugo.keystore --ks-pass pass:"$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASS" \
            --out android/app/build/outputs/apk/release/UGO-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/ugo.keystore

      - name: Имя файла
        id: name
        run: |
          if [ -f android/app/build/outputs/apk/release/UGO-signed.apk ]; then
            echo "path=android/app/build/outputs/apk/release/UGO-signed.apk" >> $GITHUB_OUTPUT
            echo "signed=подписан" >> $GITHUB_OUTPUT
          else
            echo "path=android/app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_OUTPUT
            echo "signed=НЕ подписан (нет секретов)" >> $GITHUB_OUTPUT
          fi

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: UGO-${{ github.ref_name }}
          path: ${{ steps.name.outputs.path }}

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.path }}
          body: |
            УГО ${{ github.ref_name }} — ${{ steps.name.outputs.signed }}

            Отпечаток сертификата (SHA-256) для подписанных сборок:
            `1f6c00c2affb66045812f80d30d0d6a55485567fff75170d95bd6e27650258ad`
